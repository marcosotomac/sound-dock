changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ✨ New
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 🌐 Browser extension
      labels: [browser-extension]
    - title: 📚 Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
